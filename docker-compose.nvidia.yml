# =============================================================================
# docker-compose.nvidia.yml — NVIDIA GPU overlay
# =============================================================================
# Activated when GPU_DRIVER=nvidia in .env.
# The compose() wrapper in scripts/lib/common.sh merges this file automatically:
#   docker compose -f docker-compose.yml -f docker-compose.nvidia.yml ...
#
# Requirements:
#   - NVIDIA driver 535+
#   - nvidia-container-toolkit installed and docker runtime configured
#   - Run: sudo nvidia-ctk runtime configure --runtime=docker && sudo systemctl restart docker
# =============================================================================

services:
  ollama:
    environment:
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
