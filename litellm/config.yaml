# =============================================================================
# litellm/config.yaml — LiteLLM proxy model registry
# =============================================================================
# Defines which cloud models the proxy exposes. Each `model_name` is the
# public id seen by clients (Open WebUI dropdown, opencode, curl). The
# `litellm_params.model` field tells LiteLLM which provider/model to call.
#
# Provider keys are read from the container env (set in .env, see
# .env.example). Models whose key is empty will fail at call-time with a
# clear "missing api key" error — they still show up in the catalogue but
# are inert. That's intentional: edit this file to remove what you don't
# want to see.
#
# Reload after editing: `docker compose --profile cloud up -d --force-recreate litellm`
# =============================================================================

model_list:
  # --- Anthropic (Claude) ----------------------------------------------------
  - model_name: claude-opus-4-7
    litellm_params:
      model: anthropic/claude-opus-4-7
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: claude-sonnet-4-6
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: claude-haiku-4-5
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY

  # --- Local Ollama (exposed through LiteLLM so Anthropic-format clients ----
  # like Claude Code can hit them via `/v1/messages`).
  #
  # The `model_name` is the public id the client picks; `model:` tells
  # LiteLLM which Ollama tag to call. `api_base` points at the Ollama
  # service on the shared compose network (`edge-ai-net`).
  #
  # NOTE: use `ollama/` not `ollama_chat/` — Claude Code sends content as an
  # array (tool results, multi-turn), which ollama_chat rejects with
  # "cannot unmarshal array into Go struct field ... content of type string".
  #
  # Pull commands (run on the host):
  #   ollama pull qwen2.5-coder:7b      # fast, daily tasks (already have)
  #   ollama pull qwen2.5-coder:14b     # balanced quality/speed
  #   ollama pull qwen2.5-coder:32b     # best pure coding quality
  #   ollama pull devstral              # agentic coding, multi-file (best for Claude Code)
  #   ollama pull qwen3:14b             # newer gen, thinking mode
  #   ollama pull qwen3:32b             # best reasoning + coding (recommended top pick)
  #   ollama pull gpt-oss:20b           # OpenAI open-weights, variety
  #   ollama pull phi4:14b              # Microsoft, strong at logic/code for size
  #   ollama pull mistral-small:22b     # fast, good instruction following

  # --- qwen2.5-coder family --------------------------------------------------
  - model_name: qwen2.5-coder
    litellm_params:
      model: ollama/qwen2.5-coder:7b
      api_base: http://ollama:11434

  - model_name: qwen2.5-coder-32k
    litellm_params:
      model: ollama/qwen2.5-coder-32k
      api_base: http://ollama:11434

  - model_name: qwen2.5-coder:14b
    litellm_params:
      model: ollama/qwen2.5-coder:14b
      api_base: http://ollama:11434

  - model_name: qwen2.5-coder:32b
    litellm_params:
      model: ollama/qwen2.5-coder:32b
      api_base: http://ollama:11434

  # --- qwen3 family (thinking mode supported) --------------------------------
  - model_name: qwen3:14b
    litellm_params:
      model: ollama/qwen3:14b
      api_base: http://ollama:11434

  - model_name: qwen3:32b
    litellm_params:
      model: ollama/qwen3:32b
      api_base: http://ollama:11434

  # --- Mistral coding agents -------------------------------------------------
  - model_name: devstral
    litellm_params:
      model: ollama/devstral
      api_base: http://ollama:11434

  - model_name: devstral-32k
    litellm_params:
      model: ollama/devstral-32k
      api_base: http://ollama:11434

  # --- OpenAI open-weights ---------------------------------------------------
  - model_name: gpt-oss
    litellm_params:
      model: ollama/gpt-oss:20b
      api_base: http://ollama:11434

  # --- Microsoft Phi ---------------------------------------------------------
  - model_name: phi4:14b
    litellm_params:
      model: ollama/phi4:14b
      api_base: http://ollama:11434

  # --- Mistral general -------------------------------------------------------
  - model_name: mistral-small
    litellm_params:
      model: ollama/mistral-small:22b
      api_base: http://ollama:11434

  # --- NVIDIA Nemotron -------------------------------------------------------
  - model_name: nemotron
    litellm_params:
      model: ollama/nemotron:latest
      api_base: http://ollama:11434

  - model_name: nemotron-nano
    litellm_params:
      model: ollama/nemotron-3-nano:latest
      api_base: http://ollama:11434

  # --- Local models (DGX Spark / GB10, 128 GB unified memory) ---------------
  # gemma4 family — vision capable, thinking architecture
  - model_name: localmodel26b
    litellm_params:
      model: ollama/localmodel26b:latest
      api_base: http://ollama:11434

  - model_name: localmodel26b-32k
    litellm_params:
      model: ollama/localmodel26b-32k:latest
      api_base: http://ollama:11434

  - model_name: gemma4
    litellm_params:
      model: ollama/gemma4:26b
      api_base: http://ollama:11434

  - model_name: gemma4-32k
    litellm_params:
      model: ollama/gemma4-32k:latest
      api_base: http://ollama:11434

  # qwen3-coder — best for agentic coding + tool use (Roo, OpenHands)
  - model_name: qwen3-coder
    litellm_params:
      model: ollama/qwen3-coder:30b
      api_base: http://ollama:11434

  - model_name: qwen3-coder-32k
    litellm_params:
      model: ollama/qwen3-coder-32k:latest
      api_base: http://ollama:11434

  - model_name: qwen3-coder-next
    litellm_params:
      model: ollama/qwen3-coder-next:latest
      api_base: http://ollama:11434

  # qwen3.6:27b — dense 27B, Gated DeltaNet, 262K context, SWE-bench 77.2%
  - model_name: qwen3.6:27b
    litellm_params:
      model: ollama/qwen3.6:27b
      api_base: http://ollama:11434

  # qwen2.5-vl — vision + language
  - model_name: qwen2.5vl
    litellm_params:
      model: ollama/qwen2.5vl:7b
      api_base: http://ollama:11434

  - model_name: qwen2.5vl-32k
    litellm_params:
      model: ollama/qwen2.5vl-32k:latest
      api_base: http://ollama:11434

  # --- LM Studio (host-side desktop app) -------------------------------------
  # LM Studio (https://lmstudio.ai) runs on the host as a desktop app, not in
  # a container. It exposes an OpenAI-compatible endpoint at
  # http://<host>:1234/v1. We reach it via `host.docker.internal` (set in
  # docker-compose.yml under extra_hosts on the litellm service).
  #
  # `LMSTUDIO_*` env vars come from .env (see .env.example). The model id
  # LM Studio reports literally contains a slash (e.g. "openai/gpt-oss-20b"),
  # so we tell LiteLLM the provider via `custom_llm_provider: openai` and pass
  # the full model id as-is — otherwise LiteLLM would strip the leading
  # "openai/" and the request would 404 in LM Studio.
  #
  # To switch the loaded model, change LMSTUDIO_MODEL in .env then:
  #   docker compose --profile cloud up -d --force-recreate litellm
  # Or just run `bash scripts/37-setup-lmstudio.sh` again.
  - model_name: lmstudio
    litellm_params:
      model: os.environ/LMSTUDIO_MODEL
      api_base: os.environ/LMSTUDIO_BASE_URL
      api_key: os.environ/LMSTUDIO_API_KEY
      custom_llm_provider: openai

  # --- OpenAI ----------------------------------------------------------------
  # Uncomment after setting OPENAI_PROVIDER_API_KEY in .env.
  # - model_name: gpt-4o
  #   litellm_params:
  #     model: openai/gpt-4o
  #     api_key: os.environ/OPENAI_API_KEY
  # - model_name: gpt-4o-mini
  #   litellm_params:
  #     model: openai/gpt-4o-mini
  #     api_key: os.environ/OPENAI_API_KEY

  # --- Google Gemini ---------------------------------------------------------
  # Uncomment after setting GEMINI_API_KEY in .env.
  # - model_name: gemini-1.5-pro
  #   litellm_params:
  #     model: gemini/gemini-1.5-pro
  #     api_key: os.environ/GEMINI_API_KEY

litellm_settings:
  # Drop unsupported params silently rather than 400-ing the client. Open
  # WebUI sometimes sends OpenAI-only fields (e.g. `frequency_penalty`) to
  # Anthropic models, which would otherwise fail.
  drop_params: true
  # Surface upstream provider errors verbatim instead of LiteLLM's wrapper.
  set_verbose: false
  # Large local models on CPU can take many minutes per request.
  # Set generous timeouts so Claude Code agentic tasks don't get cut off.
  request_timeout: 21600    # 2 hours
  stream_timeout: 21600     # 2 hours (streaming responses)

general_settings:
  max_request_timeout: 21600
