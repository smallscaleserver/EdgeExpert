# =============================================================================
# litellm/config.windows.yaml — LiteLLM config for Windows-native Ollama mode
# =============================================================================
# Same as config.yaml but Ollama API base points at host.docker.internal
# instead of the 'ollama' container service (which doesn't exist in
# docker-compose.windows.yml).
#
# Used by: docker-compose.windows.yml → litellm service
# =============================================================================

model_list:
  # --- Anthropic (Claude) ----------------------------------------------------
  - model_name: claude-opus-4-7
    litellm_params:
      model: anthropic/claude-opus-4-7
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: claude-sonnet-4-6
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: claude-haiku-4-5
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY

  # --- Local Ollama (Windows host) -------------------------------------------
  # api_base points at host.docker.internal because Ollama runs as ollama.exe
  # on Windows — not as a container on this compose network.
  #
  # NOTE: use `ollama/` not `ollama_chat/` — Claude Code sends content as an
  # array (tool results, multi-turn), which ollama_chat rejects with
  # "cannot unmarshal array into Go struct field ... content of type string".
  #
  # Pull commands (run on Windows host):
  #   ollama pull qwen2.5-coder:7b      # fast, daily tasks (already have)
  #   ollama pull qwen2.5-coder:14b     # balanced quality/speed
  #   ollama pull qwen2.5-coder:32b     # best pure coding quality
  #   ollama pull devstral              # agentic coding, multi-file (best for Claude Code)
  #   ollama pull qwen3:14b             # newer gen, thinking mode
  #   ollama pull qwen3:32b             # best reasoning + coding (recommended top pick)
  #   ollama pull gpt-oss:20b           # OpenAI open-weights, variety
  #   ollama pull phi4:14b              # Microsoft, strong at logic/code for size
  #   ollama pull mistral-small:22b     # fast, good instruction following

  # --- qwen2.5-coder family --------------------------------------------------
  - model_name: qwen2.5-coder
    litellm_params:
      model: ollama/qwen2.5-coder:7b
      api_base: http://host.docker.internal:11434

  - model_name: qwen2.5-coder-32k
    litellm_params:
      model: ollama/qwen2.5-coder-32k
      api_base: http://host.docker.internal:11434

  - model_name: qwen2.5-coder:14b
    litellm_params:
      model: ollama/qwen2.5-coder:14b
      api_base: http://host.docker.internal:11434

  - model_name: qwen2.5-coder:32b
    litellm_params:
      model: ollama/qwen2.5-coder:32b
      api_base: http://host.docker.internal:11434

  # --- qwen3 family (thinking mode supported) --------------------------------
  - model_name: qwen3:14b
    litellm_params:
      model: ollama/qwen3:14b
      api_base: http://host.docker.internal:11434

  - model_name: qwen3:32b
    litellm_params:
      model: ollama/qwen3:32b
      api_base: http://host.docker.internal:11434

  # --- Mistral coding agents -------------------------------------------------
  - model_name: devstral
    litellm_params:
      model: ollama/devstral
      api_base: http://host.docker.internal:11434

  - model_name: devstral-32k
    litellm_params:
      model: ollama/devstral-32k
      api_base: http://host.docker.internal:11434

  # --- OpenAI open-weights ---------------------------------------------------
  - model_name: gpt-oss
    litellm_params:
      model: ollama/gpt-oss:20b
      api_base: http://host.docker.internal:11434

  # --- Microsoft Phi ---------------------------------------------------------
  - model_name: phi4:14b
    litellm_params:
      model: ollama/phi4:14b
      api_base: http://host.docker.internal:11434

  # --- Mistral general -------------------------------------------------------
  - model_name: mistral-small
    litellm_params:
      model: ollama/mistral-small:22b
      api_base: http://host.docker.internal:11434

  # --- Legacy / kept for compatibility ---------------------------------------
  - model_name: nemotron-nano
    litellm_params:
      model: ollama/nemotron3:nano-instruct
      api_base: http://host.docker.internal:11434

  # --- LM Studio (Windows host) ----------------------------------------------
  - model_name: lmstudio
    litellm_params:
      model: os.environ/LMSTUDIO_MODEL
      api_base: os.environ/LMSTUDIO_BASE_URL
      api_key: os.environ/LMSTUDIO_API_KEY
      custom_llm_provider: openai

  # --- OpenAI ----------------------------------------------------------------
  # - model_name: gpt-4o
  #   litellm_params:
  #     model: openai/gpt-4o
  #     api_key: os.environ/OPENAI_API_KEY

  # --- Google Gemini ---------------------------------------------------------
  # - model_name: gemini-1.5-pro
  #   litellm_params:
  #     model: gemini/gemini-1.5-pro
  #     api_key: os.environ/GEMINI_API_KEY

litellm_settings:
  drop_params: true
  set_verbose: false
  # Large local models on CPU can take many minutes per request.
  # Set generous timeouts so Claude Code agentic tasks don't get cut off.
  request_timeout: 7200    # 2 hours
  stream_timeout: 7200     # 2 hours (streaming responses)

general_settings:
  # Allow long-running requests from Claude Code
  max_request_timeout: 7200
