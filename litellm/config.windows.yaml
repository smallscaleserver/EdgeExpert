# =============================================================================
# litellm/config.windows.yaml — LiteLLM config for Windows-native Ollama mode
# =============================================================================
# Same as config.yaml but Ollama API base points at host.docker.internal
# instead of the 'ollama' container service (which doesn't exist in
# docker-compose.windows.yml).
#
# Used by: docker-compose.windows.yml → litellm service
#
# LOCAL MODEL PROVIDER: openai/ pointing at Ollama's /v1 endpoint
# ---------------------------------------------------------------
# We use `openai/<model>` + api_base=.../v1 instead of `ollama/<model>`.
# Ollama exposes a full OpenAI-compatible /v1/chat/completions endpoint.
# LiteLLM's OpenAI handler is far more stable than its custom Ollama handler:
#   - No KeyError: 'arguments' when parsing tool-call responses (LiteLLM bug)
#   - No crash when content is an array (Claude Code sends arrays for multi-turn)
#   - Handles streaming, tool-use, and multi-turn correctly
# api_key can be any non-empty string — Ollama ignores it.
#
# Pull commands (run on Windows host):
#   ollama pull qwen2.5-coder:7b      # fast, daily tasks
#   ollama pull qwen2.5-coder:14b     # balanced quality/speed
#   ollama pull qwen2.5-coder:32b     # best pure coding quality
#   ollama pull devstral              # agentic coding, multi-file
#   ollama pull qwen3:14b             # newer gen, thinking mode
#   ollama pull qwen3:32b             # best reasoning + coding
#   ollama pull gpt-oss:20b           # OpenAI open-weights
#   ollama pull phi4:14b              # Microsoft, strong logic/code
#   ollama pull mistral-small:22b     # fast, good instruction following
# =============================================================================

model_list:
  # --- Anthropic (Claude) ----------------------------------------------------
  - model_name: claude-opus-4-7
    litellm_params:
      model: anthropic/claude-opus-4-7
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: claude-sonnet-4-6
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: claude-haiku-4-5
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY

  # --- Local Ollama via OpenAI-compatible /v1 endpoint -----------------------
  # All local models use openai/ provider pointing at Ollama's /v1 endpoint.
  # This avoids LiteLLM's buggy ollama-specific handler (tool-call parsing).

  # --- qwen2.5-coder family --------------------------------------------------
  - model_name: qwen2.5-coder
    litellm_params:
      model: openai/qwen2.5-coder:7b
      api_base: http://host.docker.internal:11434/v1
      api_key: ollama
      timeout: 21600
      stream_timeout: 21600

  # qwen2.5-coder-partial: 20/28 layers on GPU (70% GPU / 30% CPU).
  # Ollama 0.23.4 full-GPU Vulkan runner crashes on long prompts (>~800 tokens).
  # Partial offload avoids the crash while keeping GPU acceleration (~5 tok/s).
  # Automatic fallback → qwen2.5-coder-cpu via router_settings below.
  - model_name: qwen2.5-coder-partial
    litellm_params:
      model: openai/qwen2.5-coder-partial
      api_base: http://host.docker.internal:11434/v1
      api_key: ollama
      timeout: 21600
      stream_timeout: 21600

  # qwen2.5-coder-partial-hermes: partial GPU via ollama_chat/ for Claude Code tool-use.
  # 20/28 layers on GPU → ~3.8 GB VRAM — more stable than full-GPU (qwen2.5-coder-8k).
  # Intel Arc 140T Vulkan full-GPU crashes after ~7 min; partial offload avoids this.
  # Uses hermes-style JSON mode for tool call parsing (same as qwen2.5-coder-8k-hermes).
  - model_name: qwen2.5-coder-partial-hermes
    litellm_params:
      model: ollama_chat/qwen2.5-coder-partial
      api_base: http://host.docker.internal:11434
      api_key: ollama
      timeout: 21600
      stream_timeout: 21600

  # qwen2.5-coder-stable: ultra-stable GPU variant for Intel Arc 140T.
  # 14/28 GPU layers + num_batch 16 + num_ctx 4096 — minimizes Vulkan crash risk.
  # Trade-off: slower prompt eval due to num_batch 16, but generation stays ~10 tok/s.
  - model_name: qwen2.5-coder-stable
    litellm_params:
      model: ollama_chat/qwen2.5-coder-stable
      api_base: http://host.docker.internal:11434
      api_key: ollama
      timeout: 21600
      stream_timeout: 21600

  # qwen2.5-coder-cpu: CPU-only fallback (~4 tok/s). Never crashes, any prompt length.
  - model_name: qwen2.5-coder-cpu
    litellm_params:
      model: openai/qwen2.5-coder-cpu
      api_base: http://host.docker.internal:11434/v1
      api_key: ollama
      timeout: 21600
      stream_timeout: 21600

  # qwen2.5-coder-8k: 8k context, ~5 GB VRAM — stable for Claude Code tool-use on Vulkan.
  # Uses openai/ provider (Ollama /v1 endpoint) — stable streaming/multi-turn.
  - model_name: qwen2.5-coder-8k
    litellm_params:
      model: openai/qwen2.5-coder-8k
      api_base: http://host.docker.internal:11434/v1
      api_key: ollama
      timeout: 21600
      stream_timeout: 21600

  # qwen2.5-coder-8k-hermes: GPU model via ollama_chat/ + hermes parser.
  # hermes converts plain {"name":...,"arguments":...} text → proper tool_calls API format.
  # Note: GPU (Vulkan) crashes on Intel Arc 140T for complex/long inference. Use cpu-hermes instead.
  - model_name: qwen2.5-coder-8k-hermes
    litellm_params:
      model: ollama_chat/qwen2.5-coder-8k
      api_base: http://host.docker.internal:11434
      api_key: ollama
      timeout: 21600
      stream_timeout: 21600
      tool_call_parser: hermes

  # qwen2.5-coder-cpu-hermes: CPU-only model via ollama_chat/ + hermes parser.
  # Stable for Claude Code tool-use: no Vulkan crash, hermes converts text → tool_calls.
  # Slow (~4 tok/s) but never crashes. This is the working local AI coding model for Arc 140T.
  - model_name: qwen2.5-coder-cpu-hermes
    litellm_params:
      model: ollama_chat/qwen2.5-coder-cpu
      api_base: http://host.docker.internal:11434
      api_key: ollama
      timeout: 21600
      stream_timeout: 21600
      tool_call_parser: hermes

  - model_name: qwen2.5-coder-32k
    litellm_params:
      model: openai/qwen2.5-coder-32k
      api_base: http://host.docker.internal:11434/v1
      api_key: ollama
      timeout: 21600
      stream_timeout: 21600

  - model_name: qwen2.5-coder:14b
    litellm_params:
      model: openai/qwen2.5-coder:14b
      api_base: http://host.docker.internal:11434/v1
      api_key: ollama
      timeout: 21600
      stream_timeout: 21600

  # qwen2.5-coder-14b-stable: 14B GPU model safe for Intel Arc 140T.
  # num_batch=64 → 256ms per Vulkan submit (safe under 2s TDR threshold).
  # ollama_chat/ + hermes: converts plain {"name":...,"arguments":...} text → proper tool_calls API format.
  # 14B model generates correct tool call JSON (verified). Loads at 100% GPU in 6.9s.
  - model_name: qwen2.5-coder-14b-stable
    litellm_params:
      model: ollama_chat/qwen2.5-coder-14b-stable
      api_base: http://host.docker.internal:11434
      api_key: ollama
      timeout: 21600
      stream_timeout: 21600
      tool_call_parser: hermes

  - model_name: qwen2.5-coder:32b
    litellm_params:
      model: openai/qwen2.5-coder:32b
      api_base: http://host.docker.internal:11434/v1
      api_key: ollama
      timeout: 21600
      stream_timeout: 21600

  # --- qwen3 family (thinking mode supported) --------------------------------
  - model_name: qwen3:14b
    litellm_params:
      model: openai/qwen3:14b
      api_base: http://host.docker.internal:11434/v1
      api_key: ollama
      timeout: 21600
      stream_timeout: 21600

  # qwen3:14b-hermes: Claude Code tool-use variant via ollama_chat/ + hermes parser.
  # 14B model with strong tool-use capability. Requires ollama_chat_array_content.patch applied.
  - model_name: qwen3:14b-hermes
    litellm_params:
      model: ollama_chat/qwen3:14b
      api_base: http://host.docker.internal:11434
      api_key: ollama
      timeout: 21600
      stream_timeout: 21600
      tool_call_parser: hermes

  - model_name: qwen3:32b
    litellm_params:
      model: openai/qwen3:32b
      api_base: http://host.docker.internal:11434/v1
      api_key: ollama
      timeout: 21600
      stream_timeout: 21600

  # --- qwen3-coder (best for agentic coding + tool use: Roo, OpenHands) -----
  # MoE 30.5B — on Intel Arc 140T will use mostly system RAM (64 GB).
  # Run time slower than Linux DGX Spark but functional.
  - model_name: qwen3-coder
    litellm_params:
      model: openai/qwen3-coder:30b
      api_base: http://host.docker.internal:11434/v1
      api_key: ollama
      timeout: 21600
      stream_timeout: 21600

  # qwen3-coder-32k: custom Modelfile variant with num_ctx=32768.
  # Create locally: ollama pull qwen3-coder:30b && ollama create qwen3-coder-32k -f <Modelfile>
  - model_name: qwen3-coder-32k
    litellm_params:
      model: openai/qwen3-coder-32k:latest
      api_base: http://host.docker.internal:11434/v1
      api_key: ollama
      timeout: 21600
      stream_timeout: 21600

  # --- Mistral coding agents -------------------------------------------------
  - model_name: devstral
    litellm_params:
      model: openai/devstral
      api_base: http://host.docker.internal:11434/v1
      api_key: ollama
      timeout: 21600
      stream_timeout: 21600

  # devstral-stable: GPU model with num_batch=64 to avoid Vulkan TDR crash on Intel Arc 140T.
  # Root cause: BatchSize=512 → 40 layers × 512 tokens ≈ 2s per Vulkan submit → Windows TDR fires.
  # Fix: num_batch=64 → 40 × 64 × 0.1ms = 256ms per submit — safe under 2s TDR threshold.
  # Uses openai/ provider for native structured tool_calls (no hermes parser needed).
  - model_name: devstral-stable
    litellm_params:
      model: openai/devstral-stable
      api_base: http://host.docker.internal:11434/v1
      api_key: ollama
      timeout: 21600
      stream_timeout: 21600

  # devstral-cpu: CPU-only devstral for Claude Code tool-use on Intel Arc 140T.
  # devstral is purpose-built for agentic coding and follows Claude Code tool schema.
  # Slow (~2-4 tok/s) but stable — no Vulkan crash, no GPU needed.
  - model_name: devstral-cpu
    litellm_params:
      model: ollama_chat/devstral-cpu
      api_base: http://host.docker.internal:11434
      api_key: ollama
      timeout: 21600
      stream_timeout: 21600
      tool_call_parser: hermes

  # devstral-cpu-native: same CPU model but via OpenAI-compatible endpoint.
  # Uses Ollama's native structured tool_calls instead of JSON mode injection.
  # This is the correct path — tool names and inputs are always exact.
  - model_name: devstral-cpu-native
    litellm_params:
      model: openai/devstral-cpu
      api_base: http://host.docker.internal:11434/v1
      api_key: ollama
      timeout: 21600
      stream_timeout: 21600

  # devstral-32k: large context for deep multi-file tasks.
  # Note: 21 GB VRAM on Vulkan — if the runner crashes, use devstral-8k.
  - model_name: devstral-32k
    litellm_params:
      model: openai/devstral-32k
      api_base: http://host.docker.internal:11434/v1
      api_key: ollama
      timeout: 21600
      stream_timeout: 21600

  # devstral-8k: 8k context, ~15 GB VRAM — stable for Claude Code tool-use.
  - model_name: devstral-8k
    litellm_params:
      model: openai/devstral-8k
      api_base: http://host.docker.internal:11434/v1
      api_key: ollama
      timeout: 21600
      stream_timeout: 21600

  # --- OpenAI open-weights ---------------------------------------------------
  - model_name: gpt-oss
    litellm_params:
      model: openai/gpt-oss:20b
      api_base: http://host.docker.internal:11434/v1
      api_key: ollama
      timeout: 21600
      stream_timeout: 21600

  # --- Microsoft Phi ---------------------------------------------------------
  - model_name: phi4:14b
    litellm_params:
      model: openai/phi4:14b
      api_base: http://host.docker.internal:11434/v1
      api_key: ollama
      timeout: 21600
      stream_timeout: 21600

  # --- Mistral general -------------------------------------------------------
  - model_name: mistral-small
    litellm_params:
      model: openai/mistral-small:22b
      api_base: http://host.docker.internal:11434/v1
      api_key: ollama
      timeout: 21600
      stream_timeout: 21600

  # --- DeepSeek Coder V2 Lite (16B total, 2.4B active MoE) -----------------
  # Lite variant: only 2.4B params active per token → fast inference even on CPU.
  # GPU variant: fast but may crash Vulkan on Intel Arc 140T.
  - model_name: deepseek-coder-v2
    litellm_params:
      model: ollama_chat/deepseek-coder-v2:16b
      api_base: http://host.docker.internal:11434
      api_key: ollama
      timeout: 21600
      stream_timeout: 21600
      tool_call_parser: hermes

  # deepseek-coder-v2-cpu: CPU-only, stable — no Vulkan crash.
  # MoE with 2.4B active params → reasonable CPU speed (~5-8 tok/s).
  - model_name: deepseek-coder-v2-cpu
    litellm_params:
      model: ollama_chat/deepseek-coder-v2-cpu
      api_base: http://host.docker.internal:11434
      api_key: ollama
      timeout: 21600
      stream_timeout: 21600
      tool_call_parser: hermes

  # --- Legacy / kept for compatibility ---------------------------------------
  - model_name: nemotron-nano
    litellm_params:
      model: openai/nemotron-3-nano:latest
      api_base: http://host.docker.internal:11434/v1
      api_key: ollama
      timeout: 21600
      stream_timeout: 21600

  # --- LM Studio (Windows host) ----------------------------------------------
  - model_name: lmstudio
    litellm_params:
      model: os.environ/LMSTUDIO_MODEL
      api_base: os.environ/LMSTUDIO_BASE_URL
      api_key: os.environ/LMSTUDIO_API_KEY
      custom_llm_provider: openai

  # --- OpenAI ----------------------------------------------------------------
  # - model_name: gpt-4o
  #   litellm_params:
  #     model: openai/gpt-4o
  #     api_key: os.environ/OPENAI_API_KEY

  # --- Google Gemini ---------------------------------------------------------
  # - model_name: gemini-1.5-pro
  #   litellm_params:
  #     model: gemini/gemini-1.5-pro
  #     api_key: os.environ/GEMINI_API_KEY

litellm_settings:
  drop_params: true
  set_verbose: false
  # Large local models on CPU can take many minutes per request.
  # 6 hours - user is willing to wait, machine runs slow but finishes.
  request_timeout: 21600    # 6 hours
  stream_timeout: 21600     # 6 hours
  # hermes parser converts plain {"name":...,"arguments":...} text → tool_calls API format.
  # Needed because Ollama only generates <tool_call> tags on GPU; CPU path outputs raw JSON text.
  tool_call_parser: hermes

router_settings:
  # GPU fallback chain for Intel Arc 140T Vulkan stability.
  # On a 500 error (Vulkan crash), step down to fewer GPU layers — never to CPU.
  #   Full GPU (28/28)  →  Partial GPU (20/28)  →  Stable GPU (14/28)
  fallbacks:
    - qwen2.5-coder-8k-hermes:
        - qwen2.5-coder-partial-hermes
    - qwen2.5-coder-partial-hermes:
        - qwen2.5-coder-stable
    - qwen2.5-coder-8k:
        - qwen2.5-coder-partial
    - qwen2.5-coder-partial:
        - qwen2.5-coder-stable
  num_retries: 1
  retry_after: 0

general_settings:
  max_request_timeout: 21600  # 6 hours
