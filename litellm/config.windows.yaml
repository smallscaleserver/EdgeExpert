# =============================================================================
# litellm/config.windows.yaml — LiteLLM config for Windows-native Ollama mode
# =============================================================================
# Same as config.yaml but Ollama API base points at host.docker.internal
# instead of the 'ollama' container service (which doesn't exist in
# docker-compose.windows.yml).
#
# Used by: docker-compose.windows.yml → litellm service
#
# LOCAL MODEL PROVIDER: openai/ pointing at Ollama's /v1 endpoint
# ---------------------------------------------------------------
# We use `openai/<model>` + api_base=.../v1 instead of `ollama/<model>`.
# Ollama exposes a full OpenAI-compatible /v1/chat/completions endpoint.
# LiteLLM's OpenAI handler is far more stable than its custom Ollama handler:
#   - No KeyError: 'arguments' when parsing tool-call responses (LiteLLM bug)
#   - No crash when content is an array (Claude Code sends arrays for multi-turn)
#   - Handles streaming, tool-use, and multi-turn correctly
# api_key can be any non-empty string — Ollama ignores it.
#
# Pull commands (run on Windows host):
#   ollama pull qwen2.5-coder:7b      # fast, daily tasks
#   ollama pull qwen2.5-coder:14b     # balanced quality/speed
#   ollama pull qwen2.5-coder:32b     # best pure coding quality
#   ollama pull devstral              # agentic coding, multi-file
#   ollama pull qwen3:14b             # newer gen, thinking mode
#   ollama pull qwen3:32b             # best reasoning + coding
#   ollama pull gpt-oss:20b           # OpenAI open-weights
#   ollama pull phi4:14b              # Microsoft, strong logic/code
#   ollama pull mistral-small:22b     # fast, good instruction following
# =============================================================================

model_list:
  # --- Anthropic (Claude) ----------------------------------------------------
  - model_name: claude-opus-4-7
    litellm_params:
      model: anthropic/claude-opus-4-7
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: claude-sonnet-4-6
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: claude-haiku-4-5
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY

  # --- Local Ollama via OpenAI-compatible /v1 endpoint -----------------------
  # All local models use openai/ provider pointing at Ollama's /v1 endpoint.
  # This avoids LiteLLM's buggy ollama-specific handler (tool-call parsing).

  # --- qwen2.5-coder family --------------------------------------------------
  - model_name: qwen2.5-coder
    litellm_params:
      model: openai/qwen2.5-coder:7b
      api_base: http://host.docker.internal:11434/v1
      api_key: ollama

  - model_name: qwen2.5-coder-32k
    litellm_params:
      model: openai/qwen2.5-coder-32k
      api_base: http://host.docker.internal:11434/v1
      api_key: ollama

  - model_name: qwen2.5-coder:14b
    litellm_params:
      model: openai/qwen2.5-coder:14b
      api_base: http://host.docker.internal:11434/v1
      api_key: ollama

  - model_name: qwen2.5-coder:32b
    litellm_params:
      model: openai/qwen2.5-coder:32b
      api_base: http://host.docker.internal:11434/v1
      api_key: ollama

  # --- qwen3 family (thinking mode supported) --------------------------------
  - model_name: qwen3:14b
    litellm_params:
      model: openai/qwen3:14b
      api_base: http://host.docker.internal:11434/v1
      api_key: ollama

  - model_name: qwen3:32b
    litellm_params:
      model: openai/qwen3:32b
      api_base: http://host.docker.internal:11434/v1
      api_key: ollama

  # --- Mistral coding agents -------------------------------------------------
  - model_name: devstral
    litellm_params:
      model: openai/devstral
      api_base: http://host.docker.internal:11434/v1
      api_key: ollama

  # devstral-32k: large context for deep multi-file tasks.
  # Note: 21 GB VRAM on Vulkan — if the runner crashes, use devstral-8k.
  - model_name: devstral-32k
    litellm_params:
      model: openai/devstral-32k
      api_base: http://host.docker.internal:11434/v1
      api_key: ollama

  # devstral-8k: 8k context, ~15 GB VRAM — stable for Claude Code tool-use.
  - model_name: devstral-8k
    litellm_params:
      model: openai/devstral-8k
      api_base: http://host.docker.internal:11434/v1
      api_key: ollama

  # --- OpenAI open-weights ---------------------------------------------------
  - model_name: gpt-oss
    litellm_params:
      model: openai/gpt-oss:20b
      api_base: http://host.docker.internal:11434/v1
      api_key: ollama

  # --- Microsoft Phi ---------------------------------------------------------
  - model_name: phi4:14b
    litellm_params:
      model: openai/phi4:14b
      api_base: http://host.docker.internal:11434/v1
      api_key: ollama

  # --- Mistral general -------------------------------------------------------
  - model_name: mistral-small
    litellm_params:
      model: openai/mistral-small:22b
      api_base: http://host.docker.internal:11434/v1
      api_key: ollama

  # --- Legacy / kept for compatibility ---------------------------------------
  - model_name: nemotron-nano
    litellm_params:
      model: openai/nemotron3:nano-instruct
      api_base: http://host.docker.internal:11434/v1
      api_key: ollama

  # --- LM Studio (Windows host) ----------------------------------------------
  - model_name: lmstudio
    litellm_params:
      model: os.environ/LMSTUDIO_MODEL
      api_base: os.environ/LMSTUDIO_BASE_URL
      api_key: os.environ/LMSTUDIO_API_KEY
      custom_llm_provider: openai

  # --- OpenAI ----------------------------------------------------------------
  # - model_name: gpt-4o
  #   litellm_params:
  #     model: openai/gpt-4o
  #     api_key: os.environ/OPENAI_API_KEY

  # --- Google Gemini ---------------------------------------------------------
  # - model_name: gemini-1.5-pro
  #   litellm_params:
  #     model: gemini/gemini-1.5-pro
  #     api_key: os.environ/GEMINI_API_KEY

litellm_settings:
  drop_params: true
  set_verbose: false
  # Large local models on CPU can take many minutes per request.
  # 6 hours - user is willing to wait, machine runs slow but finishes.
  request_timeout: 21600    # 6 hours
  stream_timeout: 21600     # 6 hours

general_settings:
  max_request_timeout: 21600  # 6 hours
