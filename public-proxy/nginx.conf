map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8081;

    # ── Internal: JWT validation called by auth_request ──────────────────────
    location = /auth-check {
        internal;
        proxy_pass               http://edge-public-auth:5000/check;
        proxy_set_header         Cookie $http_cookie;
        proxy_pass_request_body  off;
        proxy_set_header         Content-Length "";
    }

    # ── Public: fingerprint collection page (no auth gate) ───────────────────
    location = /login {
        proxy_pass       http://edge-public-auth:5000/login;
        proxy_set_header Host $host;
    }

    # ── Public: fingerprint POST → auto-login (no auth gate) ─────────────────
    location = /do-login {
        proxy_pass       http://edge-public-auth:5000/do-login;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
    }

    # ── Named location: redirect to login page when JWT is missing/invalid ───
    location @need_login {
        return 302 /login;
    }

    # ── Everything else: protected by JWT check ───────────────────────────────
    location / {
        auth_request  /auth-check;
        error_page 401 = @need_login;

        proxy_pass            http://edge-open-webui-public:8080;
        proxy_http_version    1.1;
        proxy_set_header      Upgrade          $http_upgrade;
        proxy_set_header      Connection       $connection_upgrade;
        proxy_set_header      Host             $host;
        proxy_set_header      X-Real-IP        $remote_addr;
        proxy_set_header      X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_buffering       off;
        proxy_cache           off;
    }
}
